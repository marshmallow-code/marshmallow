# https://github.com/pydantic/pydantic/blob/e56f60fd32273d1d7c397a3ac46bba05e6a73454/.github/workflows/enforce-issue-assignment.yml

name: Enforce issue assignment

on:
  # zizmor: ignore[dangerous-triggers] -- pull_request_target is safe without a downstream checkout
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: read

jobs:
  check-assignment:
    if: >
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'COLLABORATOR' &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check referenced issues and close if unauthorized
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 20) {
                      nodes {
                        number
                        assignees(first: 20) { nodes { login } }
                      }
                    }
                  }
                }
              }
            `;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number,
            });

            const refs = result.repository.pullRequest.closingIssuesReferences.nodes;
            const unauthorized = refs.filter(
              issue => !issue.assignees.nodes.some(a => a.login === author)
            );
            if (refs.length > 0 && unauthorized.length === 0) {
              core.info(`Author ${author} is assigned to all referenced issues.`);
              return;
            }

            const issueList = refs.length === 0
              ? 'no closing issue referenced'
              : unauthorized.map(i => `#${i.number}`).join(', ');
            let body =
              `@${author} You do not have permission to open a PR without ` +
              `being assigned to the referenced issue (${issueList}).`;

            const policyResponse = await fetch(
              'https://raw.githubusercontent.com/marshmallow-code/.github/refs/heads/main/AI_POLICY.md'
            );
            if (policyResponse.ok) {
              const aiPolicy = await policyResponse.text();
              body +=
                `\n\n<details>\n<summary>AI Policy</summary>\n\n` +
                `${aiPolicy}\n\n</details>`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });
